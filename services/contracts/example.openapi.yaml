openapi: 3.1.0
info:
  title: Example Karpy service
  version: 1.0.0
  description: |
    Reference contract for a Karpy service (implemented by `services/go-template`).
    Copy this file to `services/contracts/<service>.openapi.yaml` for a new service.

    Every `/v1/*` operation requires the four `X-Karpy-*` signing headers
    (see `signing.md`). OpenAPI cannot express "all four together" or the
    canonical-string computation; the security requirement below lists them so
    generators and readers know they are needed.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: ops
  - name: example
paths:
  /healthz:
    get:
      tags: [ops]
      operationId: liveness
      summary: Liveness - the process is up. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /readyz:
    get:
      tags: [ops]
      operationId: readiness
      summary: Readiness - dependencies reachable; returns 503 while starting or draining.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: Not ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
  /v1/echo:
    post:
      tags: [example]
      operationId: echo
      summary: Echo a message back (example signed endpoint; also emits `example.echo.received`).
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EchoRequest"}
      responses:
        "200":
          description: Echoed
          headers:
            X-Request-Id:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EchoResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
security:
  - karpyKeyId: []
    karpyTimestamp: []
    karpyNonce: []
    karpySignature: []
components:
  securitySchemes:
    karpyKeyId:
      type: apiKey
      in: header
      name: X-Karpy-Key-Id
      description: Id of the shared HMAC key used to sign the request.
    karpyTimestamp:
      type: apiKey
      in: header
      name: X-Karpy-Timestamp
      description: Unix time in seconds. Must be within the service's skew window (default 300 s).
    karpyNonce:
      type: apiKey
      in: header
      name: X-Karpy-Nonce
      description: Single-use random value, 16-128 chars of [A-Za-z0-9_-].
    karpySignature:
      type: apiKey
      in: header
      name: X-Karpy-Signature
      description: "`v1=<hex HMAC-SHA256(secret, canonical string)>`; canonical string defined in signing.md."
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation id; generated by the service when absent and echoed back.
      schema: {type: string, maxLength: 128}
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context.
      schema: {type: string}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable snake_case code (e.g. `unauthorized`, `request_replayed`, `invalid_request`, `payload_too_large`, `not_found`, `internal_error`).
            message:
              type: string
              description: Human-readable, safe to show; never contains secrets or internals.
            request_id:
              type: string
      example:
        error: {code: unauthorized, message: Invalid service authentication., request_id: req-7f3a}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [alive]}
        service: {type: string}
        version: {type: string}
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, unavailable]}
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ready, unavailable]
    EchoRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 1024}
    EchoResponse:
      type: object
      required: [message, key_id, request_id, received_at]
      properties:
        message: {type: string}
        key_id: {type: string, description: Key id that signed the request.}
        request_id: {type: string}
        received_at: {type: string, format: date-time}
