# Prometheus for local development (compose profile "observability").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics arrive over OTLP and are exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # RabbitMQ built-in Prometheus plugin (enabled by default in rabbitmq:3.13+ images).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
